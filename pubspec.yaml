# pubspec.yaml
name: holding_tycoon
description: "A mobile holding tycoon game built in Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  google_fonts: ^6.3.3
  provider: ^6.1.2
  flame: ^1.38.2
  flame_svg: ^2.0.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/