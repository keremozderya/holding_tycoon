name: holding_tycoon
description: "A mobile holding tycoon game built in Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev.

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Resimlerin ve assetlerin projede tanitilmasi
  assets:
    - assets/images/logo.png
    - assets/images/background.jpg