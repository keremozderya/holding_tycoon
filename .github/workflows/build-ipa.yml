name: Ücretsiz IPA Çıktısı Al

on:
  push:
    branches:
      - main

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v3

      - name: Flutter Ortamını Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri İndir
        run: flutter pub get

      - name: iOS Uygulamasını Derle ve Paketle
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../ipa/HoldingTycoon.ipa Payload
          cd ../../..

      - name: IPA Dosyasını GitHub'a Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: holding-tycoon-ipa
          path: build/ios/ipa/*.ipa